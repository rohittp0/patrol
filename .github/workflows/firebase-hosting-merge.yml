name: Validate and deploy Patrol to Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-live
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Test private saves and browser progression
        run: npx --yes firebase-tools@13.29.1 emulators:exec --only auth,firestore --project patrol-daac9 "npm run test:saves && npm run test:rules"
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PATROL_DAAC9 }}"
      - name: Deploy game to Firebase Hosting
        run: npx --yes firebase-tools@13.29.1 deploy --only hosting --project patrol-daac9 --non-interactive
