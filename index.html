<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#182b2b" />
    <meta name="description" content="Close the net. A map strategy game of squads, borders, and one escaping runner." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/data/india-campaign.json" as="fetch" crossorigin />
    <title>Patrol — Close the net</title>
    <style>
      body{margin:0;background:#111b19}.boot-screen{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;overflow:hidden;background:radial-gradient(ellipse at center,#2d432e,#111b19 70%);color:#efe8cc;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;text-align:center}.boot-brand{font-size:26px;font-weight:950;letter-spacing:6px;display:flex;align-items:center;gap:12px}.boot-brand svg{width:32px;height:36px;color:#f4bf62}.boot-scene{width:320px;max-width:100%;height:220px;margin:25px 0 8px;overflow:visible}.boot-ring{transform-origin:160px 110px;animation:boot-radar 7s linear infinite}.boot-actor{offset-path:path('M 38 137 C 65 155 90 60 134 77 S 191 166 228 137 S 282 68 287 100');offset-rotate:0deg;animation:boot-chase 3.8s ease-in-out infinite}.boot-squad{animation-delay:.36s}.boot-post{animation:boot-post 3.8s ease-in-out infinite}.boot-post:nth-of-type(2){animation-delay:.9s}.boot-post:nth-of-type(3){animation-delay:1.8s}.boot-post:nth-of-type(4){animation-delay:2.7s}.boot-screen h1{font-size:21px;letter-spacing:-.4px;margin:0 0 11px;font-weight:850}.boot-screen p{font-size:11px;color:#a5b79a;min-height:17px;margin:0}.boot-meter{width:154px;height:5px;border-radius:5px;background:#0b1911;overflow:hidden;border:1px solid #3b5537;margin:24px 0 18px}.boot-meter:after{content:'';display:block;width:45%;height:100%;border-radius:5px;background:#f3bd56;animation:boot-meter 1.5s ease-in-out infinite}.boot-tip{font-size:9px;letter-spacing:1px;color:#70886e}.boot-screen noscript{font-size:12px;color:#dfcf9b;margin-top:20px}@keyframes boot-chase{0%{offset-distance:0%;opacity:0}7%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}@keyframes boot-radar{to{transform:rotate(360deg)}}@keyframes boot-meter{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}@keyframes boot-post{0%,85%,100%{fill:#263c2a;stroke:#6a8854}45%,65%{fill:#dcb65b;stroke:#f5d994}}@media(prefers-reduced-motion:reduce){.boot-screen *,.boot-screen *:after{animation:none!important}.boot-actor{offset-distance:60%}.boot-squad{offset-distance:35%}.boot-meter:after{transform:translateX(60%)}}
    </style>
  </head>
  <body>
    <div id="app">
      <main class="boot-screen" aria-label="Loading Patrol">
        <div class="boot-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6z"/><path d="m8 12 3 3 5-6"/></svg>PATROL</div>
        <svg class="boot-scene" viewBox="0 0 320 220" fill="none" aria-hidden="true">
          <defs><radialGradient id="boot-glow"><stop stop-color="#b1cb74" stop-opacity=".15"/><stop offset="1" stop-color="#b1cb74" stop-opacity="0"/></radialGradient></defs>
          <circle cx="160" cy="110" r="100" fill="url(#boot-glow)"/>
          <g class="boot-ring" stroke="#87a361" opacity=".3"><circle cx="160" cy="110" r="91" stroke-dasharray="2 12"/><path d="M160 8v15m0 174v15M57 110h15m174 0h15"/></g>
          <path d="m90 43 49-10 32 18 47-7 40 34-12 40 16 31-38 37-44 2-41-25-43 9-30-38 20-38z" fill="#365033" stroke="#5b7749" stroke-width="1.5"/>
          <path d="m90 96 62 13 19-58m-19 58 72 77m-72-77-13 54m13-54 94 9" stroke="#91a46a" stroke-opacity=".4"/>
          <path d="M38 137C65 155 90 60 134 77S191 166 228 137S282 68 287 100" stroke="#d6b365" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 6"/>
          <g stroke-width="2"><circle class="boot-post" cx="90" cy="96" r="8"/><circle class="boot-post" cx="171" cy="51" r="8"/><circle class="boot-post" cx="224" cy="186" r="8"/><circle class="boot-post" cx="246" cy="118" r="8"/></g>
          <g class="boot-actor"><circle r="17" fill="#e2af51" stroke="#ffe2a1" stroke-width="2"/><g transform="translate(-11 -11)" stroke="#493820" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="4" r="2"/><path d="m12 9 3-2 3 4 3 1M6 9l4-1 3 6-4 3-2 5m6-8 4 3 1 5M10 8l-2 5-4 1"/></g></g>
          <g class="boot-actor boot-squad"><circle r="17" fill="#416a71" stroke="#a5d9d2" stroke-width="2"/><path d="m0-10-8 4v7c0 5 8 10 8 10S8 6 8 1v-7z" fill="#25464a" stroke="#d8edce" stroke-width="1.5"/><path d="m-4 0 3 3 5-6" stroke="#d8edce" stroke-width="2"/></g>
        </svg>
        <h1>Closing in…</h1>
        <p id="loading-stage" role="status" aria-live="polite">Rounding up your squads…</p>
        <div class="boot-meter" role="progressbar" aria-label="Loading campaign"></div>
        <span class="boot-tip">THINK AHEAD. CLOSE THE NET.</span>
        <noscript>Enable JavaScript to play Patrol.</noscript>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
